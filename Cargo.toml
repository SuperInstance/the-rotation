[workspace]
members = [
    "crates/neon-kernel",
    "crates/log-tensor",
    "crates/pid-cascade",
    "crates/attractor",
    "crates/rotation-core",
]
resolver = "2"

[workspace.dependencies]
neon-kernel = { path = "crates/neon-kernel" }
log-tensor = { path = "crates/log-tensor" }
pid-cascade = { path = "crates/pid-cascade" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
target-cpu = "neoverse-n1"  # Oracle ARM64: Neoverse-like

[profile.bench]
debug = 1
